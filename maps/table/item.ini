[I000]
-- 父级取「空瓶」：它本身 abilList / cooldownID 就是空的，不用从父级身上摘技能。
-- 下面仍然把这两项显式写空 —— 父级哪天换了、或者 LNI 改了继承规则，这里不会跟着变。
_parent = "bzbe"
-- 名字
Name = "余烬"
-- 说明（编辑器里列物品时显示）
Description = "普通攻击附带 15 点火焰伤害，最多叠加 3 层。"
-- 提示工具 - 基础
Tip = "余烬"
-- 提示工具 - 扩展
Ubertip = "普通攻击附带 15 点火焰伤害，最多叠加 3 层。"
-- 界面图标（内置资源，不需要走 imp.ini 导入）
Art = "ReplaceableTextures\\CommandButtons\\BTNFlameStrike.blp"
-- 使用模型（地上的样子）
file = "Objects\\InventoryItems\\TreasureChest\\treasurechest.mdl"
-- 技能：必须为空。父级本来就没有，显式写死防继承变化
abilList = ""
-- CD间隔组
cooldownID = ""
-- 物品分类：永久物品（不是消耗品）
class = "Permanent"
-- 等级
Level = 1
-- 等级(旧版)
oldLevel = 1
-- 持有者死亡时掉落
drop = 1
-- 可以丢弃。**这条是 P8 测「丢下后加成消失」的前提**
droppable = 1
-- 使用完会消失
perishable = 0
-- 主动使用
usable = 0
-- 捡取时自动使用
powerup = 0
-- 可作为随机物品
pickRandom = 0
-- 可被市场出售 / 可被抵押：都不要，这是一件自定义掉落物
sellable = 0
pawnable = 0
-- 黄金消耗 / 木材消耗
goldcost = 0
lumbercost = 0
-- 最大库存量 / 补货相关：不走商店，全归零
stockMax = 0
stockRegen = 0
stockStart = 0
-- 无视CD间隔 / 有效的物品转换目标
ignoreCD = 0
morph = 0
-- 使用次数
uses = 0
-- 优先权
prio = 0
-- 模型缩放
scale = 1.0
-- 选择圈大小(编辑器)
selSize = 0.0
-- 按钮位置
Buttonpos_1 = 0
Buttonpos_2 = 0
-- 装甲类型
armor = "Wood"
-- 颜色值
colorR = 255
colorG = 255
colorB = 255
-- 热键
Hotkey = "E"
